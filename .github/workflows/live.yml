name: Live replay tests

# Runs the per-site replay tests against the real sites on the allowlist.
# They depend on those sites, so they are not a required check.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-replay-report
          path: test-results
