name: Release

# Builds the extension zip and attaches it to a GitHub release when a version tag is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: gh release create "$GITHUB_REF_NAME" dist/heyo-extension-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
